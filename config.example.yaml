# ---------------------------------------------------------------------------
# BLS Spain Egypt Appointment Bot — configuration template
#
# Copy this file to `config.yaml` and fill in the real values.
# `config.yaml` is gitignored and must never be committed.
#
#   Windows:  copy config.example.yaml config.yaml
#   Linux:    cp config.example.yaml config.yaml
# ---------------------------------------------------------------------------

bls:
  # Portal entry point. Leave as-is unless BLS changes domains.
  url: "https://egypt.blsspainglobal.com/"

  # BLS account credentials (the account used to book).
  email: ""
  password: ""

  # Locations to monitor. Valid values: cairo, alexandria
  locations:
    - cairo
    - alexandria

  # Each of the four fields below may be a single value or a LIST, like
  # locations. One cycle sweeps every combination of locations x visa_type x
  # visa_sub_type x appointment_category x appointment_for, location
  # outermost, capped by max_combinations_per_cycle. Blank takes the portal's
  # first real option.
  #
  #   visa_type:
  #     - "Schengen visa"
  #     - "National Visa"
  #
  # CONFIRMED labels, read from the form's own Kendo dataset:
  #   Visa Type            : Schengen visa | National Visa
  #   Visa Sub Type        : Schengen Visa | Airport Transit Visa (TAP)
  #                          | Medical Visit | National Visa
  #   Appointment Category : Normal | Premium | Prime Time
  #   Appointment For      : Individual | Family (2-5 Members)
  # Matching is case-insensitive and accepts a substring, so "airport transit"
  # finds "Airport Transit Visa (TAP)".
  #
  # Visa Sub Type CASCADES from Visa Type, so not every pair is valid. Invalid
  # pairs are skipped with a log line naming the unavailable option. A field
  # set to a SINGLE value instead falls back to the portal's own first option
  # and warns, because skipping would leave the cycle checking nothing.
  #
  # Mind the multiplication: 2 locations x 2 visa types x 2 sub types x 3
  # categories = 24, which exceeds the default cap of 12 and would silently
  # truncate the LAST locations, since location is the outermost loop.
  #
  # WARNING: visa_type and visa_sub_type choose WHICH VISA is applied for, not
  # which slot. Sweeping them can secure an appointment for a visa the
  # applicant is not applying for.
  visa_type: "Schengen visa"
  visa_sub_type: "Schengen Visa"
  # Same visa, different service tier, each with its own slot pool — the field
  # to sweep for more chances at the SAME visa. Premium and Prime Time carry
  # higher fees; nothing is paid without the manager, as the bot pauses at any
  # payment step (detection.payment_phrases) and waits for /resume.
  appointment_category: "Normal"
  appointment_for: "Individual"      # Individual | Family
  # Only used when appointment_for is Family: the portal then shows a
  # confirmation modal (auto-accepted) and a required "Number Of Members"
  # dropdown. Blank takes the first real option.
  family_members: ""      # individual | family

  # Optional: exact option labels the portal shows for each location.
  # The bot matches these case-insensitively against dropdown options.
  location_labels:
    cairo: "Cairo"
    alexandria: "Alexandria"

  # Relative paths on the portal.
  paths:
    # CONFIRMED: the first login page.
    login: "/Global/account/login"
    # CONFIRMED: where a successful login lands (the login form's hidden
    # ReturnUrl points here). This portal has NO /account or /dashboard page —
    # requesting one returns 404.
    dashboard: "/Global/bls/visatypeverification"
    # NOT yet confirmed — placeholder. Capture the real URL from the booking flow.
    appointment: "/Global/bls/appointment"

applicant:
  full_name: ""
  passport_number: ""
  nationality: "Egyptian"
  dob: "DD/MM/YYYY"            # format exactly as the portal expects
  phone: "+20XXXXXXXXXX"
  email: ""

  # Optional extras — filled only when a matching field exists on the form.
  passport_issue_date: ""      # DD/MM/YYYY
  passport_expiry_date: ""     # DD/MM/YYYY
  gender: ""                   # Male / Female
  place_of_birth: ""
  address: ""
  city: ""

  documents:
    passport_scan: "docs/passport.jpg"
    photo: "docs/photo.jpg"
    # Add any extra documents the form asks for; the key is matched
    # against the upload field's label / name.
    # bank_statement: "docs/bank.pdf"
    # travel_insurance: "docs/insurance.pdf"

openai:
  # Used to read the CAPTCHA tile digits with GPT-4o vision.
  # Get a key from https://platform.openai.com/api-keys
  # Leave blank to disable automatic solving — the bot then pauses and asks for
  # a manual solve over Telegram instead.
  api_key: ""
  model: "gpt-4o"
  # Seconds to wait for a vision reply before giving up on an attempt.
  timeout: 45

telegram:
  # Create a bot with @BotFather and paste the token here.
  token: ""
  # Your numeric chat id (talk to @userinfobot to get it).
  chat_id: ""
  # Heartbeat STATUS message interval, in hours. 0 disables heartbeats.
  heartbeat_hours: 6

otp:
  method: "email"              # "email" → auto-read via IMAP, "sms" → ask on Telegram
  imap_host: "imap.gmail.com"
  imap_port: 993
  imap_user: ""
  # Gmail: this must be an APP PASSWORD, not the account password.
  # Requires 2-Step Verification on, then create one at
  #   https://myaccount.google.com/apppasswords
  imap_pass: ""
  imap_folder: "INBOX"
  # Only mails whose sender or subject contains one of these is considered.
  sender_contains:
    - "blsspainglobal"
    - "bls"
  subject_contains:
    - "otp"
    - "verification"
    - "code"
  poll_attempts: 10            # IMAP polls before giving up
  poll_delay: 5                # seconds between IMAP polls
  timeout: 300                 # hard timeout for the whole OTP step, seconds

# Seconds between availability checks (per full cycle of all locations).
poll_interval: 90

# Minutes to wait after the portal explicitly reports no slots. Slots are
# released in batches, so polling every 90s only risks rate limiting.
no_slots_wait_minutes: 5

# Safety cap on the option sweep. visa_type, visa_sub_type,
# appointment_category and appointment_for may each be a LIST, and the bot
# tries every combination with every location in one cycle. Each combination
# needs its own verification captcha, so the cross-product grows fast — this
# limits how many are attempted per cycle.
max_combinations_per_cycle: 12

# Seconds to wait between combinations. MEASURED: the portal allows exactly
# ONE visa-type verification per browser session -- the second SubmitCaptcha
# answers 403 "Your session has been expired" however fresh the grid is. So
# each combination after the first gets a brand-new session: new cookies, new
# login (login captcha) and a new verification (verification captcha). That is
# two captcha solves and a burst of requests per combination, so they are
# spaced out rather than run back to back.
session_recycle_wait: 45

# false opens a visible browser window — use while debugging selectors.
headless: true

proxy:
  enabled: false
  server: ""                   # e.g. "http://host:port" or "socks5://host:port"
  username: ""
  password: ""

browser:
  # Apply playwright-stealth. DEFAULT OFF: on this portal its script throws
  # "Cannot redefine property: offsetHeight" from inside FingerprintJS's font
  # probing, which corrupts the fingerprint the server expects and makes the
  # CAPTCHA iframe be redirected to the login page.
  stealth: false
  # Let the browser load the portal's own http:// captcha iframe. The site
  # 302s it to http on an https page; Chrome blocks that as mixed content in
  # the renderer, before Playwright can see or upgrade the request.
  allow_insecure_content: true
  # Playwright navigation / action timeouts in milliseconds.
  navigation_timeout: 60000
  action_timeout: 20000
  # Random human-like delay range between actions, in seconds.
  min_delay: 0.5
  max_delay: 2.0
  locale: "en-US"
  timezone: "Africa/Cairo"
  user_agent: ""               # blank → Playwright default for Chromium

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 5000
  # Start monitoring immediately, or wait for the dashboard "Start" button.
  autostart: true
  # Entries kept in the in-memory live log table.
  log_limit: 300
  # Default UI language: "ar" (RTL) or "en" (LTR).
  default_language: "ar"

logging:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  file: "logs/bot.log"
  rotation: "10 MB"
  retention: "14 days"

retry:
  max_attempts: 3              # Playwright action/navigation retries
  page_error_wait: 30          # seconds to wait after a page error
  network_error_wait: 60       # seconds to wait after a network error
  login_attempts: 2            # login tries before backing off
  # Minutes to wait after the portal blocks us (HTTP 403) before logging in
  # again from scratch. The bot waits this out by itself and keeps running —
  # it never stops and never needs a manual restart.
  block_cooldown_minutes: 60
  # Consecutive login failures before the bot stops retrying quietly and
  # raises a critical, manager-facing pause.
  critical_login_failures: 8

# Text fragments used to decide whether slots exist. Case-insensitive.
# These are heuristics over the rendered page — adjust if BLS changes wording.
detection:
  unavailable_phrases:
    - "no appointments available"
    - "no slots are available"
    - "slots are released basis instructions"
    - "no appointment"
    - "no appointments"
    - "not available"
    - "no slot"
    - "no slots"
    - "fully booked"
    - "currently unavailable"
    - "try again later"
    - "لا توجد مواعيد"
  available_phrases:
    - "appointment available"
    - "available slot"
    - "select a date"
    - "select date"
    - "choose your slot"
  # Phrases that mean a human must finish the step.
  # Steps the bot must NEVER complete by itself — it pauses and hands over.
  payment_phrases:
    - "payment"
    - "pay now"
    - "card number"
    - "credit card"
    - "debit card"
    - "cvv"
    - "checkout"
    - "transaction"
    - "amount payable"
    - "الدفع"
  liveness_phrases:
    - "liveness"
    - "facial"
    - "face verification"
    - "selfie"
    - "take a photo of yourself"
  captcha_phrases:
    # BLS's own wording — the specific one that matters.
    - "please select all boxes with number"
    - "select all boxes"
    - "captcha"
    - "select the image"
    - "verify you are human"
    - "i'm not a robot"
