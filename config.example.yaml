# ---------------------------------------------------------------------------
# BLS Spain Egypt Appointment Bot — configuration template
#
# Copy this file to `config.yaml` and fill in the real values.
# `config.yaml` is gitignored and must never be committed.
#
#   Windows:  copy config.example.yaml config.yaml
#   Linux:    cp config.example.yaml config.yaml
# ---------------------------------------------------------------------------

bls:
  # Portal entry point. Leave as-is unless BLS changes domains.
  url: "https://egypt.blsspainglobal.com/"

  # BLS account credentials (the account used to book).
  email: ""
  password: ""

  # Locations to monitor. Valid values: cairo, alexandria
  locations:
    - cairo
    - alexandria

  # Each of the four fields below may be a single value or a LIST, like
  # locations. One cycle sweeps every combination of locations x visa_type x
  # visa_sub_type x appointment_category x appointment_for, location
  # outermost, capped by max_combinations_per_cycle. Blank takes the portal's
  # first real option.
  #
  #   visa_type:
  #     - "Schengen visa"
  #     - "National Visa"
  #
  # CONFIRMED labels, read from the form's own Kendo dataset:
  #   Visa Type            : Schengen visa | National Visa
  #   Visa Sub Type        : Schengen Visa | Airport Transit Visa (TAP)
  #                          | Medical Visit | National Visa
  #   Appointment Category : Normal | Premium | Prime Time
  #   Appointment For      : Individual | Family (2-5 Members)
  # Matching is case-insensitive and accepts a substring, so "airport transit"
  # finds "Airport Transit Visa (TAP)".
  #
  # Visa Sub Type CASCADES from Visa Type, so not every pair is valid. Invalid
  # pairs are skipped with a log line naming the unavailable option. A field
  # set to a SINGLE value instead falls back to the portal's own first option
  # and warns, because skipping would leave the cycle checking nothing.
  #
  # Mind the multiplication: 2 locations x 2 visa types x 2 sub types x 3
  # categories = 24, which exceeds the default cap of 12 and would silently
  # truncate the LAST locations, since location is the outermost loop.
  #
  # WARNING: visa_type and visa_sub_type choose WHICH VISA is applied for, not
  # which slot. Sweeping them can secure an appointment for a visa the
  # applicant is not applying for.
  visa_type: "Schengen visa"
  visa_sub_type: "Schengen Visa"
  # Same visa, different service tier, each with its own slot pool — the field
  # to sweep for more chances at the SAME visa. Premium and Prime Time carry
  # higher fees; nothing is paid without the manager, as the bot pauses at any
  # payment step (detection.payment_phrases) and waits for /resume.
  appointment_category: "Normal"
  appointment_for: "Individual"      # Individual | Family
  # Only used when appointment_for is Family: the portal then shows a
  # confirmation modal (auto-accepted) and a required "Number Of Members"
  # dropdown. Blank takes the first real option.
  family_members: ""      # individual | family

  # Optional: exact option labels the portal shows for each location.
  # The bot matches these case-insensitively against dropdown options.
  location_labels:
    cairo: "Cairo"
    alexandria: "Alexandria"

  # Relative paths on the portal.
  paths:
    # CONFIRMED: the first login page.
    login: "/Global/account/login"
    # CONFIRMED: where a successful login lands (the login form's hidden
    # ReturnUrl points here). This portal has NO /account or /dashboard page —
    # requesting one returns 404.
    dashboard: "/Global/bls/visatypeverification"
    # NOT yet confirmed — placeholder. Capture the real URL from the booking flow.
    appointment: "/Global/bls/appointment"

applicant:
  full_name: ""
  passport_number: ""
  nationality: "Egyptian"
  dob: "DD/MM/YYYY"            # format exactly as the portal expects
  phone: "+20XXXXXXXXXX"
  email: ""

  # Optional extras — filled only when a matching field exists on the form.
  passport_issue_date: ""      # DD/MM/YYYY
  passport_expiry_date: ""     # DD/MM/YYYY
  gender: ""                   # Male / Female
  place_of_birth: ""
  address: ""
  city: ""


  # --- Applicant details form (/Global/BLSAppointment/ManageAppointment) ----
  # Every field the booking form asks for. Required ones are marked REQ: the
  # portal rejects the form if they are blank, so the bot reports them rather
  # than submitting something it knows will bounce. All of these are editable
  # from the dashboard Settings tab.
  #
  # Dropdowns are matched against the option TEXT, case-insensitively and by
  # substring, so "egypt" finds "Egypt" and "ordinary" finds "Ordinary
  # Passport". Dates are yyyy-mm-dd.
  first_name: ""                 # REQ  First Name (Given Name)
  surname: ""                    # REQ  Surname (Family Name)
  surname_at_birth: ""           # REQ  Surname At Birth
  last_name: ""                  #      Last Name
  country_of_birth: "Egypt"      # REQ  dropdown
  nationality_at_birth: "Egypt"  #      dropdown
  marital_status: ""             # REQ  dropdown, e.g. Single / Married
  national_identity_number: ""   #      National Identity Number
  passport_type: "Ordinary Passport"  # REQ dropdown
  passport_issue_place: ""       # REQ  Issue Place
  passport_issue_country: "Egypt"     # REQ dropdown
  travel_date: ""                # REQ  yyyy-mm-dd, must be in the future
  address_line2: ""              #      Home Address Line2
  country: "Egypt"               # REQ  dropdown, home address country
  postal_code: ""                # REQ  Postal Code
  contact_number: ""             # REQ  digits only, no + or spaces
  employer_name: ""              # REQ  employer, or school for students
  employer_phone: ""             # REQ  digits only
  employer_address: ""           # REQ
  occupation: ""                 # REQ  dropdown
  purpose_of_journey: ""         # REQ  dropdown, e.g. Tourism
  destination_state: "Spain"     # REQ  dropdown (defaults to ESP on the page)
  second_destination_state: ""   #      dropdown
  # CONFIRMED controls: #CostCoveredById_0 and #MeansOfSupportId_0, both Kendo
  # dropdowns. Matched on option text like every other dropdown.
  cost_covered_by: ""          # REQ  who pays for the trip
  # Means Of Support is a declaration of HOW the trip is funded. Typical
  # options: Cash, Credit card, Traveller's cheques, Prepaid accommodation.
  means_of_support: ""         # REQ

  # --- Travel information (CONFIRMED ids) ----------------------------------
  # These were missing from this template, so the machine that was installed
  # from it started twenty required settings short -- and only found out after
  # taking a real slot, which the portal then held for 27 minutes. The bot now
  # says so at startup, but the template has to carry them in the first place.
  first_entry_state: ""        # REQ  dropdown, MemberStateFirstEntryId
  number_of_entries: ""        # REQ  dropdown, e.g. Single / Multiple
  # A NUMBER of days, not prose: "13 Nights 14 days" is rejected and the field
  # comes back empty, because the control only takes a count.
  intended_stay_days: ""       # REQ  e.g. "14"
  arrival_date: ""             # REQ  yyyy-mm-dd
  departure_date: ""           # REQ  yyyy-mm-dd

  # Section 9, "Fingerprints collected previously for ... a schengen visa".
  # CONFIRMED radio group PreviousFingerPrintStatus_<n>. The page defaults to
  # "taken", which ASSERTS prints were already given and then demands the date
  # -- the one field that stopped the 20:55 run with everything else filled.
  #   none   - No reason for exemption: prints will be taken at the appointment
  #   taken  - Prints taken in the last 59 months (then set the date below)
  #   exempt - For legal reasons (under 12 years old)
  fingerprints: "none"
  # Only used when fingerprints is "taken". yyyy-mm-dd.
  previous_fingerprint_date: ""

  # Section 11 of the form: WHAT the inviting party is. CONFIRMED radio group
  # BlsInvitingAuthority_<n>, whose own handler decides which half of the
  # section the page asks for:
  #   company - Inviting company/organization      -> hotel details AND a named
  #             contact person there (the page's own default; 15 fields)
  #   hotel   - Hotel(s) or temporary accommodation -> hotel details only; the
  #             eight contact_* fields below are then not asked for at all
  #   person  - Inviting person(s) in the member state -> contact person only
  # Left on "company" because the contact_* values below were supplied for it.
  # Switch to "hotel" to drop them, which is also the plainer description of a
  # tourist hotel stay.
  inviting_party: "company"

  # --- The inviting party: for a tourist trip, the hotel --------------------
  hotel_name: ""               # REQ
  hotel_country: ""            # REQ  dropdown
  hotel_city: ""               # REQ
  hotel_zip: ""                # REQ
  hotel_address: ""            # REQ
  hotel_email: ""              # REQ  the hotel's own address
  hotel_phone: ""              # REQ

  # --- A named contact person at that address ------------------------------
  contact_first_name: ""       # REQ
  contact_surname: ""          # REQ
  contact_country: ""          # REQ  dropdown
  contact_city: ""             # REQ
  contact_zip: ""              # REQ
  contact_address: ""          # REQ
  contact_phone: ""            # REQ
  contact_email: ""            # REQ

  # Controls matched by their VISIBLE LABEL instead of their element id, for
  # the parts of the form whose markup has not been captured. Read the label
  # off the page and put it here verbatim; matching is case-insensitive and
  # tolerates the required asterisk and extra words either way round. The bot
  # detects what the control is (text / dropdown / date) and fills it
  # accordingly. On a miss the log lists every label on the page, or every
  # option the dropdown offered, so one run says exactly what to write here.
  extra_fields: {}
    # "Number of Entries": "1"
    # "Intended Stay": "other"

  documents:
    passport_scan: "docs/passport.jpg"
    photo: "docs/photo.jpg"
    # Add any extra documents the form asks for; the key is matched
    # against the upload field's label / name.
    # bank_statement: "docs/bank.pdf"
    # travel_insurance: "docs/insurance.pdf"

openai:
  # Used to read the CAPTCHA tile digits with GPT-4o vision.
  # Get a key from https://platform.openai.com/api-keys
  # Leave blank to disable automatic solving — the bot then pauses and asks for
  # a manual solve over Telegram instead.
  api_key: ""
  model: "gpt-4o"
  # Seconds to wait for a vision reply before giving up on an attempt.
  timeout: 45

telegram:
  # Create a bot with @BotFather and paste the token here.
  token: ""
  # Your numeric chat id (talk to @userinfobot to get it).
  chat_id: ""
  # Heartbeat STATUS message interval, in hours. 0 disables heartbeats.
  heartbeat_hours: 6

otp:
  method: "email"              # "email" → auto-read via IMAP, "sms" → ask on Telegram
  imap_host: "imap.gmail.com"
  imap_port: 993
  imap_user: ""
  # Gmail: this must be an APP PASSWORD, not the account password.
  # Requires 2-Step Verification on, then create one at
  #   https://myaccount.google.com/apppasswords
  imap_pass: ""
  imap_folder: "INBOX"
  # Only mails whose sender or subject contains one of these is considered.
  sender_contains:
    - "blsspainglobal"
    - "bls"
  subject_contains:
    - "otp"
    - "verification"
    - "code"
  poll_attempts: 10            # IMAP polls before giving up
  poll_delay: 5                # seconds between IMAP polls
  timeout: 300                 # hard timeout for the whole OTP step, seconds

# Seconds between availability checks (per full cycle of all locations).
poll_interval: 90

# Minutes to wait after the portal explicitly reports no slots. Slots are
# released in batches, so polling every 90s only risks rate limiting.
no_slots_wait_minutes: 5

# Safety cap on the option sweep. visa_type, visa_sub_type,
# appointment_category and appointment_for may each be a LIST, and the bot
# tries every combination with every location in one cycle. Each combination
# needs its own verification captcha, so the cross-product grows fast — this
# limits how many are attempted per cycle.
max_combinations_per_cycle: 12

# Seconds to wait between combinations. MEASURED: the portal allows exactly
# ONE visa-type verification per browser session -- the second SubmitCaptcha
# answers 403 "Your session has been expired" however fresh the grid is. So
# each combination after the first gets a brand-new session: new cookies, new
# login (login captcha) and a new verification (verification captcha). That is
# two captcha solves and a burst of requests per combination, so they are
# spaced out rather than run back to back.
session_recycle_wait: 45

# How many option combinations to try per cycle. Each one needs its own
# browser session AND its own login, and the portal rate-limits that hard:
# two logins inside ~2.5 minutes was enough for it to answer 403 to
# LoginCaptchaSubmit and then to the login page itself (run 20261013_184753).
# So the sweep is spread ACROSS cycles -- each cycle takes the next slice and
# resumes there next time, still covering every combination, just over minutes
# rather than all at once. With 8 combinations and a 5-minute wait, full
# coverage takes about 40 minutes. Raise only if your IP proves tolerant.
combinations_per_cycle: 1

# Earliest appointment to accept, in days from today. The portal offers dates
# it will not actually serve slots for: picking tomorrow left the Time Slot
# list permanently empty. A green day inside this window is skipped.
min_days_ahead: 2

# Seconds to wait for the Time Slot list after a date is chosen. The options
# arrive by AJAX, and Kendo builds the dropdown's items from whatever data it
# holds at the moment it is OPENED -- so the bot re-opens the box once a
# second until options actually render, rather than opening it once and
# watching an empty list.
slot_wait_seconds: 30

# false opens a visible browser window — use while debugging selectors.
headless: true

proxy:
  enabled: false
  server: ""                   # e.g. "http://host:port" or "socks5://host:port"
  username: ""
  password: ""

browser:
  # Apply playwright-stealth. DEFAULT OFF: on this portal its script throws
  # "Cannot redefine property: offsetHeight" from inside FingerprintJS's font
  # probing, which corrupts the fingerprint the server expects and makes the
  # CAPTCHA iframe be redirected to the login page.
  stealth: false
  # Let the browser load the portal's own http:// captcha iframe. The site
  # 302s it to http on an https page; Chrome blocks that as mixed content in
  # the renderer, before Playwright can see or upgrade the request.
  allow_insecure_content: true
  # Playwright navigation / action timeouts in milliseconds.
  navigation_timeout: 60000
  action_timeout: 20000
  # Random human-like delay range between actions, in seconds.
  min_delay: 0.5
  max_delay: 2.0
  locale: "en-US"
  timezone: "Africa/Cairo"
  user_agent: ""               # blank → Playwright default for Chromium

dashboard:
  enabled: true
  # Password for the dashboard. The page shows the applicant's personal data
  # and edits this file, which holds the portal password, the Telegram token
  # and the OpenAI key -- so the dashboard REFUSES to start on a non-loopback
  # host while this is empty.
  #
  # Traffic is plain HTTP. On anything beyond a trusted LAN, put it behind a
  # TLS reverse proxy or a VPN, or the password and the data it protects cross
  # the network in the clear.
  password: ""
  # 127.0.0.1 = this machine only. Use 0.0.0.0 to accept connections from the
  # network (a password is then mandatory). Changing this needs a restart.
  host: "127.0.0.1"
  port: 5000
  # Start monitoring immediately, or wait for the dashboard "Start" button.
  autostart: true
  # Entries kept in the in-memory live log table.
  log_limit: 300
  # Default UI language: "ar" (RTL) or "en" (LTR).
  default_language: "ar"

logging:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  file: "logs/bot.log"
  rotation: "10 MB"
  retention: "14 days"
  # Days of run artifacts to keep. Screenshots, DOM dumps, captcha samples
  # and run transcripts older than this are deleted at startup and after
  # every cycle: they reached 301 MB across 758 files in a few days, and only
  # the run that produced a failure is ever worth reading.
  retention_days: 2
  # Captcha grid images were only ever kept to grade the solver against
  # hand-written labels. It is reliable now, and they were the single largest
  # thing on disk (110 MB), so they are off.
  save_captcha_samples: false

retry:
  max_attempts: 3              # Playwright action/navigation retries
  page_error_wait: 30          # seconds to wait after a page error
  network_error_wait: 60       # seconds to wait after a network error
  login_attempts: 2            # login tries before backing off
  # Minutes to wait after the portal blocks us (HTTP 403) before logging in
  # again from scratch. The bot waits this out by itself and keeps running —
  # it never stops and never needs a manual restart.
  block_cooldown_minutes: 60
  # Ceiling on that doubling, in minutes. A flat retry is what turned one
  # refusal into a ten-hour outage: the bot asked every 8 minutes from 05:00
  # to 15:27, about 75 times, against an edge refusing the FIRST request of
  # every session -- which is the behaviour that keeps an address flagged.
  # Each consecutive block now waits twice as long as the last, up to this,
  # and the count resets as soon as a login succeeds.
  block_cooldown_max_minutes: 180
  # Consecutive login failures before the bot stops retrying quietly and
  # raises a critical, manager-facing pause.
  critical_login_failures: 8

# Text fragments used to decide whether slots exist. Case-insensitive.
# These are heuristics over the rendered page — adjust if BLS changes wording.
detection:
  unavailable_phrases:
    - "no appointments available"
    - "no slots are available"
    - "slots are released basis instructions"
    - "no appointment"
    - "no appointments"
    - "not available"
    - "no slot"
    - "no slots"
    - "fully booked"
    - "currently unavailable"
    - "try again later"
    - "لا توجد مواعيد"
  available_phrases:
    - "appointment available"
    - "available slot"
    - "select a date"
    - "select date"
    - "choose your slot"
  # Phrases that mean a human must finish the step.
  # Steps the bot must NEVER complete by itself — it pauses and hands over.
  payment_phrases:
    - "payment"
    - "pay now"
    - "card number"
    - "credit card"
    - "debit card"
    - "cvv"
    - "checkout"
    - "transaction"
    - "amount payable"
    - "الدفع"
  liveness_phrases:
    - "liveness"
    - "facial"
    - "face verification"
    - "selfie"
    - "take a photo of yourself"
  captcha_phrases:
    # BLS's own wording — the specific one that matters.
    - "please select all boxes with number"
    - "select all boxes"
    - "captcha"
    - "select the image"
    - "verify you are human"
    - "i'm not a robot"

# --- Debugging -------------------------------------------------------------
debug:
  # Leave the browser window OPEN when a booking step fails, instead of
  # tearing it down, so the half-filled page can be inspected. Applies to the
  # booking form not submitting, the applicant form not completing, and
  # required fields still being empty. Use with start_headful.bat -- there is
  # nothing to look at in headless mode.
  keep_browser_open: false
  # How long to idle while holding it, in minutes. Close the terminal when
  # finished; the bot does nothing else during this time.
  hold_minutes: 30
